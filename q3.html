<html>

<head>

    <title>Text Animations</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .container {
            text-align: center;
        }

        /* Fade In Animation */
        .fade-in {
            opacity: 0;
            animation: fadeIn 2s ease-in forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Slide In Animation */
        .slide-in {
            transform: translateX(-100%);
            opacity: 0;
            animation: slideIn 1.5s ease-out forwards;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Typing Animation */
        .typing {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid #000;
            animation: typing 3s steps(30, end) forwards, blink 0.5s step-end infinite;
        }

        @keyframes typing {
            from {
                width: 0;
            }

            to {
                width: 100%;
            }
        }

        @keyframes blink {

            from,
            to {
                border-color: transparent;
            }

            50% {
                border-color: black;
            }
        }

        h1 {
            font-size: 2em;
            margin: 1em 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="fade-in">Fade In Text</h1>
        <h1 class="slide-in">Slide In Text</h1>
        <h1 class="typing">Typing Effect Text</h1>
    </div>
</body>

</html>
